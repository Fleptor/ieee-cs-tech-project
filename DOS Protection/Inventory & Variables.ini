#inventory/hosts.ini

[router]
soho-router ansible_host=192.168.1.1 
ansible_user=admin 
ansible_become=true

#group_vars/all.yml

# Network Interfaces
wan_interface: "eth0"
lan_interface: "eth1"

# Thresholds for DoS/DDoS Detection
dos_thresholds:
  icmp_per_second: 50        # Max ICMP packets/sec per IP
  syn_per_second: 100        # Max SYN packets/sec per IP
  udp_per_second: 200        # Max UDP packets/sec per IP
  conn_per_minute: 300       # Max total connections/min per IP
  ban_duration: 3600         # Block duration in seconds (1 hour)

# Alert Settings
alert_email: "admin@yourdomain.com"
smtp_host: "smtp.gmail.com"
smtp_port: 587
smtp_user: "your@gmail.com"
smtp_password: "your_app_password"

# Fail2ban Settings
fail2ban_maxretry: 5
fail2ban_findtime: 60
fail2ban_bantime: 3600

# Whitelist - never block these IPs
whitelist_ips:
  - "192.168.1.1"
  - "127.0.0.1"