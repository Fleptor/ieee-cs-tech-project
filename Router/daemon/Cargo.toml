[package]
name = "daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
aya = "0.14.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
flatbuffers = "2.0.8"
futures-util = "0.3.32"
hyperloglog = "1.0.3"
libc = "0.2.186"
native-tls = "0.2.18"
rustc-hash = "2.1.3"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
tokio-util = "0.7.11"
dotenvy = "0.15"
serde_json = "1.0"
